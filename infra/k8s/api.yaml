apiVersion: apps/v1
kind: Deployment
metadata:
  name: amrutam-api
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: amrutam-api }
  template:
    metadata:
      labels: { app: amrutam-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      # spread across zones so one AZ going down doesn't take the API with it
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: amrutam-api }
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: amrutam-api
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: amrutam-config }
            - secretRef: { name: amrutam-secrets }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # give the LB time to drop us before SIGTERM
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: amrutam-api
spec:
  selector: { app: amrutam-api }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amrutam-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amrutam-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amrutam-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: amrutam-api }
